# Temporary: builds a debug APK from this branch so it can be side-loaded onto
# a test phone. Not part of the change under review; drop this file before
# opening a PR.
name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [fix/stream-thinking-parts]

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
