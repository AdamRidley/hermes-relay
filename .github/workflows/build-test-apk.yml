# Temporary: builds a debug APK from this branch so it can be side-loaded onto
# a test phone. Not part of the change under review; drop this file before
# opening a PR.
name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [fix/stream-thinking-parts]

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Use a stable debug keystore
        # Every runner mints its own debug key, so APKs from different runs
        # cannot update one another. A shared debug key lets each new build
        # replace the previous test install in place.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Unit tests
        # Scoped to the class this branch adds: the full suite carries two
        # pre-existing TimeoutCancellationException failures unrelated to it.
        run: ./gradlew testSideloadDebugUnitTest --tests "com.hermesandroid.relay.data.ThinkingSegmentsTest" --tests "com.hermesandroid.relay.data.ToolLabelTest" --console=plain

      - name: Build the sideload debug APK
        # Only the sideload flavour is installed on the test phone; building the
        # Play flavour too doubles assemble time and the artifact for nothing.
        # One ABI: the test phone is arm64, and the universal APK carries four
        # (196 MB) because of the native voice/VAD libraries. This is the repo's
        # documented dev fast path (-Phermes.devAbi), not a change to shipped
        # builds; it makes the artifact roughly a third of the size.
        run: ./gradlew assembleSideloadDebug -Phermes.devAbi=arm64-v8a --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
